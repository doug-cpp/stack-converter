[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stackconverter"
version = "0.1.0"
description = "AI-Assisted Source Code Migration Accelerator with a Deterministic Codebase Graph and Viability Gate."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [
    { name = "Douglas" }
]
dependencies = [
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "typer>=0.12.5",
    "rich>=13.9.0",
    "langgraph>=0.2.50",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "networkx>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
stackconverter = "stackconverter.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["stackconverter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.uv]
override-dependencies = ["cryptography<49"]
no-build-package = ["cryptography", "pydantic-core", "orjson", "xxhash", "zstandard"]


